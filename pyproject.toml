[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ShookLink"
version = "0.1.0"
description = "Cross-platform serial peer link"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8,<7",
    "pyserial>=3.5,<4",
    "cryptography>=44,<47",
    "pyte>=0.8.2,<1",
    "pywinpty>=2.0.13,<3; sys_platform == 'win32'",
    "pyobjc-framework-Quartz>=10.3,<13; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10.3,<13; sys_platform == 'darwin'",
]

[project.scripts]
shooklink = "shooklink.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
